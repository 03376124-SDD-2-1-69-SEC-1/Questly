[project]
name = "questly"
version = "0.1.0"
description = "Team scaffold for instructor-facing assignment authoring"
readme = "README.md"
authors = [
    { name = "Doonminus2", email = "piezapiezakok@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.40.0",
    "fastapi[standard]>=0.139.2",
    "jinja2>=3.1.6",
    "openrouter>=1.3.43",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

# --------------- Tool configuration ---------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on sys.path so tests can import the fakes in tests/fakes/.
# They live under tests/ on purpose: an in-memory adapter inside src/ can be
# wired into a running application by accident.
pythonpath = ["."]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "postgres: talks to a real database through POSTGRES_TEST_URL. Skipped when that variable is unset; see tests/conftest.py",
    "r2: talks to a real R2 bucket through R2_TEST_*. Skipped when those variables are unset; see tests/conftest.py",
    "judge0: talks to a real Judge0 CE through JUDGE0_TEST_URL. Skipped when that variable is unset, in CI too; see tests/conftest.py",
]

[tool.coverage.run]
source = ["questly"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN401"]

[tool.ruff.lint.isort]
# `tests` is an import root too (see pytest pythonpath), so the fakes and
# contracts sort with questly instead of landing among third-party packages.
known-first-party = ["questly", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "I001"]
