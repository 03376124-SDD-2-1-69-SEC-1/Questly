name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  # อนุญาตให้กด "Re-run" ได้ตรง ๆ แม้ trigger จะเป็น pull_request เท่านั้น
  workflow_dispatch:

# ยกเลิก run เก่าของ PR เดียวกันถ้ามี push ใหม่เข้ามาทับ ประหยัดเวลา CI
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: questly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d questly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ค่า dummy สำหรับ config/settings ที่ต้องมี env ตอน import แอป
    # unit/architecture ไม่ต่อ DB จริง จึงใส่ค่าปลอมพอให้ import ผ่าน
    # ห้ามชี้ค่าพวกนี้ไปที่ Neon จริง — tests/conftest.py จะ fail ถ้า
    # POSTGRES_TEST_URL ชี้ compute เดียวกับ DATABASE_URL
    env:
      APP_ENV: test
      APP_PORT: 8000
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/questly_test
      DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/questly_test
      DATABASE_URL_UNPOOLED: postgresql+psycopg://user:pass@localhost:5432/questly_test
      SECRET_KEY: ci-dummy-secret-key
      R2_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
      R2_BUCKET_NAME: ci-dummy-bucket
      R2_ACCESS_KEY_ID: ci-dummy-access-key
      R2_SECRET_ACCESS_KEY: ci-dummy-secret-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Apply migrations to the disposable PostgreSQL service
        env:
          DATABASE_URL_UNPOOLED: ${{ env.POSTGRES_TEST_URL }}
        run: uv run alembic upgrade head

      # Other `postgres` and `r2` tests still require the external integration runner.
      - name: Run tests
        run: uv run pytest -q -m "not postgres and not r2"

      - name: Test classroom CSV exports on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@not-a-database.invalid/questly
          DATABASE_URL_UNPOOLED: postgresql+psycopg://ci:ci@not-a-database.invalid/questly
        run: uv run pytest -q tests/db/test_classroom_exports.py
